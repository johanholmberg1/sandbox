name: run-tests
run-name: ${{ github.actor }} is running tests 🧪

on:
  workflow_call:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install pnpm + Node.js
        uses: pnpm/setup@v2
      # TODO: replace with real tests once they exist
      - name: Run tests
        run: pnpm test
