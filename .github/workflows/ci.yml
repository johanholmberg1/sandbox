name: ci
run-name: ${{ github.actor }} is running CI 🚀

on:
  push:
    branches:
      - develop

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      node_ver: ${{ steps.vars.outputs.node_ver }}
      pnpm_ver: ${{ steps.vars.outputs.pnpm_ver }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
      - name: Read node/pnpm versions from package.json
        id: vars
        run: |
          echo "node_ver=$(jq -r '.engines.node' package.json)" >> "$GITHUB_OUTPUT"
          echo "pnpm_ver=$(jq -r '.devEngines.packageManager.version' package.json)" >> "$GITHUB_OUTPUT"

  run-tests:
    needs: versions
    uses: ./.github/workflows/run-tests.yml
    with:
      node_ver: ${{ needs.versions.outputs.node_ver }}
      pnpm_ver: ${{ needs.versions.outputs.pnpm_ver }}

  generate-docs:
    needs: run-tests
    uses: ./.github/workflows/generate-docs.yml
    with:
      node_ver: ${{ needs.versions.outputs.node_ver }}
      pnpm_ver: ${{ needs.versions.outputs.pnpm_ver }}
