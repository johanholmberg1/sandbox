name: ci
run-name: ${{ github.actor }} is running CI 🚀

on:
  push:
    branches:
      - develop

jobs:
  versions:
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      node_ver: ${{ steps.vars.outputs.node_ver }}
      pnpm_ver: ${{ steps.vars.outputs.pnpm_ver }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
      - uses: pnpm/setup@v1
        with:
            version: 11.24.0
            runtime: node@24
            cache: truePUT"

  run-tests:
    needs: versions
    uses: ./.github/workflows/run-tests.yml
    with:
      node_ver: ${{ needs.versions.outputs.node_ver }}
      pnpm_ver: ${{ needs.versions.outputs.pnpm_ver }}

  generate-docs:
    needs: run-tests
    uses: ./.github/workflows/generate-docs.yml
    with:
      node_ver: ${{ needs.versions.outputs.node_ver }}
      pnpm_ver: ${{ needs.versions.outputs.pnpm_ver }}
